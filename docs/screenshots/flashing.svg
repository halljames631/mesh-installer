<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780" style="background: #0B0F14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142634" />
      <stop offset="100%" stop-color="#1B384D" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#00E5BD" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151C24" />
      <stop offset="100%" stop-color="#11171E" />
    </linearGradient>
  </defs>

  <!-- Device Frame Outline -->
  <rect x="2" y="2" width="376" height="776" rx="36" fill="#0B0F14" stroke="#222C38" stroke-width="2.5"/>

  <!-- Status Bar -->
  <text x="28" y="28" fill="#8E9AA8" font-size="11" font-weight="600">09:42</text>
  <g transform="translate(315, 18)" fill="#8E9AA8">
    <path d="M0 8 h4 v-3 h-4 v3 M6 8 h4 v-5 h-4 v5 M12 8 h4 v-8 h-4 v8" fill="#8E9AA8"/>
    <rect x="20" y="2" width="18" height="9" rx="2" fill="none" stroke="#8E9AA8" stroke-width="1.2"/>
    <rect x="22" y="4" width="12" height="5" rx="1" fill="#00C9A7"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="340" height="54" rx="14" fill="url(#headerGrad2)" stroke="#234B68" stroke-width="1"/>
    <circle cx="28" cy="27" r="14" fill="#58A6FF" opacity="0.2"/>
    <path d="M28 19 L28 35 M22 29 L28 35 L34 29" fill="none" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="26" fill="#E6EDF3" font-size="16" font-weight="700">Flashing Firmware</text>
    <text x="52" y="41" fill="#58A6FF" font-size="10" font-weight="600">ESPTOOL SLIP PROTOCOL ACTIVE</text>
    <rect x="256" y="16" width="68" height="22" rx="11" fill="#238636" opacity="0.2"/>
    <text x="290" y="31" fill="#3FB950" font-size="10" font-weight="700" text-anchor="middle">921.6 KBPS</text>
  </g>

  <!-- Card 1: Active Progress Gauge -->
  <g transform="translate(20, 114)">
    <rect x="0" y="0" width="340" height="250" rx="16" fill="url(#cardGrad2)" stroke="#222C38" stroke-width="1"/>
    
    <!-- Circular Progress Gauge -->
    <g transform="translate(170, 95)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#1F2833" stroke-width="10"/>
      <!-- 72% dash: 2 * PI * 62 = 389.5, 72% is 280.4 -->
      <circle cx="0" cy="0" r="62" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-dasharray="280.4 109.1" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="10" fill="#FFFFFF" font-size="32" font-weight="800" text-anchor="middle">72%</text>
      <text x="0" y="28" fill="#00E5BD" font-size="10" font-weight="700" text-anchor="middle">WRITING FLASH</text>
    </g>

    <!-- Detailed Status Label -->
    <text x="170" y="186" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">LilyGO T-Deck (MUI Touch)</text>
    <text x="170" y="204" fill="#7D8590" font-size="11" text-anchor="middle">Partition: <tspan fill="#58A6FF" font-weight="600">app0 @ 0x10000</tspan> (1.8MB / 2.5MB)</text>

    <!-- Linear Progress Bar -->
    <g transform="translate(24, 222)">
      <rect x="0" y="0" width="292" height="8" rx="4" fill="#1C232D"/>
      <rect x="0" y="0" width="210" height="8" rx="4" fill="url(#cyanGrad)"/>
    </g>
  </g>

  <!-- Stats Grid -->
  <g transform="translate(20, 376)">
    <rect x="0" y="0" width="106" height="58" rx="12" fill="#151C24" stroke="#222C38" stroke-width="1"/>
    <text x="53" y="22" fill="#7D8590" font-size="10" font-weight="600" text-anchor="middle">BLOCK RATE</text>
    <text x="53" y="44" fill="#00E5BD" font-size="14" font-weight="700" text-anchor="middle">84.2 KB/s</text>

    <rect x="117" y="0" width="106" height="58" rx="12" fill="#151C24" stroke="#222C38" stroke-width="1"/>
    <text x="170" y="22" fill="#7D8590" font-size="10" font-weight="600" text-anchor="middle">CRC32 VERIFY</text>
    <text x="170" y="44" fill="#3FB950" font-size="14" font-weight="700" text-anchor="middle">PASSED</text>

    <rect x="234" y="0" width="106" height="58" rx="12" fill="#151C24" stroke="#222C38" stroke-width="1"/>
    <text x="287" y="22" fill="#7D8590" font-size="10" font-weight="600" text-anchor="middle">EST. TIME</text>
    <text x="287" y="44" fill="#58A6FF" font-size="14" font-weight="700" text-anchor="middle">00:08</text>
  </g>

  <!-- Card 2: Live Protocol Log Window -->
  <g transform="translate(20, 446)">
    <rect x="0" y="0" width="340" height="174" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="28" rx="14" fill="#161B22"/>
    <circle cx="16" cy="14" r="4" fill="#F85149"/>
    <circle cx="28" cy="14" r="4" fill="#E3B341"/>
    <circle cx="40" cy="14" r="4" fill="#3FB950"/>
    <text x="60" y="18" fill="#8B949E" font-size="10" font-weight="600">ROM Bootloader Protocol Logs</text>

    <!-- Monospace code lines -->
    <text x="14" y="48" fill="#7EE787" font-size="9.5" font-family="monospace">[09:42:01] DTR/RTS pulse sent: chip in bootloader</text>
    <text x="14" y="64" fill="#58A6FF" font-size="9.5" font-family="monospace">[09:42:02] Connected: ESP32-S3 (MAC: 34:85:18:2b:8a:1c)</text>
    <text x="14" y="80" fill="#8B949E" font-size="9.5" font-family="monospace">[09:42:03] Flash stub uploaded. Baud 115200 -> 921600</text>
    <text x="14" y="96" fill="#7EE787" font-size="9.5" font-family="monospace">[09:42:04] bootloader.bin @ 0x0000 (15,488 B)... OK</text>
    <text x="14" y="112" fill="#7EE787" font-size="9.5" font-family="monospace">[09:42:05] partition-table.bin @ 0x8000 (3,072 B)... OK</text>
    <text x="14" y="128" fill="#00E5BD" font-size="9.5" font-family="monospace">[09:42:06] firmware-t-deck-tft-2.8.1.bin @ 0x10000</text>
    <text x="14" y="144" fill="#E3B341" font-size="9.5" font-family="monospace">[09:42:10] >> Writing block 114/158 (72%)...</text>
    <text x="14" y="160" fill="#3FB950" font-size="9.5" font-family="monospace">[09:42:10] >> CRC32 block checksum verified: 0x9F41C2A7</text>
  </g>

  <!-- Cancel / Abort Button -->
  <g transform="translate(20, 630)">
    <rect x="0" y="0" width="340" height="46" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="170" y="28" fill="#F85149" font-size="12" font-weight="700" text-anchor="middle">ABORT FLASHING</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 696)">
    <rect x="0" y="0" width="380" height="84" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <circle cx="68" cy="28" r="16" fill="#00C9A7" opacity="0.15"/>
    <path d="M68 20 L62 32 L68 30 L74 36 L70 24 Z" fill="#00E5BD"/>
    <text x="68" y="52" fill="#00E5BD" font-size="10" font-weight="700" text-anchor="middle">Flasher</text>
    <rect x="156" y="20" width="16" height="12" rx="2" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="164" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Terminal</text>
    <path d="M256 20 h16 v12 h-16 z M260 20 v-2 a4 4 0 0 1 8 0 v2" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="264" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Vault</text>
    <circle cx="330" cy="26" r="7" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="330" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Test Bench</text>
  </g>
</svg>
