<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780" style="background: #0B0F14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B26" />
      <stop offset="100%" stop-color="#143D35" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#00E5BD" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151C24" />
      <stop offset="100%" stop-color="#11171E" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Device Frame Outline -->
  <rect x="2" y="2" width="376" height="776" rx="36" fill="#0B0F14" stroke="#222C38" stroke-width="2.5"/>

  <!-- Status Bar -->
  <text x="28" y="28" fill="#8E9AA8" font-size="11" font-weight="600">09:41</text>
  <g transform="translate(315, 18)" fill="#8E9AA8">
    <path d="M0 8 h4 v-3 h-4 v3 M6 8 h4 v-5 h-4 v5 M12 8 h4 v-8 h-4 v8" fill="#8E9AA8"/>
    <rect x="20" y="2" width="18" height="9" rx="2" fill="none" stroke="#8E9AA8" stroke-width="1.2"/>
    <rect x="22" y="4" width="12" height="5" rx="1" fill="#00C9A7"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="340" height="54" rx="14" fill="url(#headerGrad)" stroke="#1D4E43" stroke-width="1"/>
    <circle cx="28" cy="27" r="14" fill="#00C9A7" opacity="0.2"/>
    <path d="M22 27 L26 31 L34 23" fill="none" stroke="#00E5BD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="26" fill="#E6EDF3" font-size="16" font-weight="700">Mesh Installer</text>
    <text x="52" y="41" fill="#7EE787" font-size="10" font-weight="600">USB OTG CONNECTED • 921.6K</text>
    <rect x="268" y="16" width="56" height="22" rx="11" fill="#00C9A7" opacity="0.15"/>
    <text x="296" y="31" fill="#00E5BD" font-size="10" font-weight="700" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Card 1: Connected Device -->
  <g transform="translate(20, 114)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="110" rx="16" fill="url(#cardGrad)" stroke="#222C38" stroke-width="1"/>
    <text x="18" y="24" fill="#8B949E" font-size="10" font-weight="700" letter-spacing="0.8">CONNECTED HARDWARE</text>
    <rect x="270" y="12" width="54" height="18" rx="9" fill="#238636" opacity="0.25"/>
    <text x="297" y="24" fill="#3FB950" font-size="9" font-weight="700" text-anchor="middle">ESP32-S3</text>
    
    <text x="18" y="52" fill="#FFFFFF" font-size="17" font-weight="700">LilyGO T-Deck / Plus</text>
    <text x="18" y="70" fill="#7D8590" font-size="11">ROM: ESP32-S3 (v0.1) • 16MB Quad-SPI Flash</text>
    <text x="18" y="88" fill="#7D8590" font-size="11">Port: <tspan fill="#58A6FF">/dev/bus/usb/001/002</tspan> (Vendor: 0x303A)</text>
    <circle cx="316" cy="62" r="6" fill="#3FB950"/>
    <circle cx="316" cy="62" r="10" fill="none" stroke="#3FB950" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Card 2: Firmware Selector -->
  <g transform="translate(20, 236)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="236" rx="16" fill="url(#cardGrad)" stroke="#222C38" stroke-width="1"/>
    <text x="18" y="24" fill="#8B949E" font-size="10" font-weight="700" letter-spacing="0.8">FIRMWARE CONFIGURATION</text>

    <!-- Ecosystem Pill Selector -->
    <rect x="18" y="38" width="148" height="32" rx="8" fill="#00C9A7" opacity="0.15" stroke="#00C9A7" stroke-width="1"/>
    <text x="92" y="58" fill="#00E5BD" font-size="12" font-weight="700" text-anchor="middle">Meshtastic</text>
    <rect x="174" y="38" width="148" height="32" rx="8" fill="#1C232D" stroke="#2D3748" stroke-width="1"/>
    <text x="248" y="58" fill="#8B949E" font-size="12" font-weight="600" text-anchor="middle">MeshCore</text>

    <!-- Track Selector -->
    <text x="18" y="94" fill="#C9D1D9" font-size="11" font-weight="600">Release Track</text>
    <rect x="18" y="104" width="148" height="30" rx="6" fill="#1C232D" stroke="#00C9A7" stroke-width="1.5"/>
    <text x="92" y="123" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Alpha (v2.8.1)</text>
    <rect x="174" y="104" width="148" height="30" rx="6" fill="#161B22" stroke="#222C38" stroke-width="1"/>
    <text x="248" y="123" fill="#8B949E" font-size="11" font-weight="500" text-anchor="middle">Stable (v2.5.4)</text>

    <!-- Variant Selector (MUI vs BaseUI) -->
    <text x="18" y="156" fill="#C9D1D9" font-size="11" font-weight="600">LilyGO T-Deck Variant</text>
    <g transform="translate(18, 166)">
      <rect x="0" y="0" width="304" height="48" rx="8" fill="#132320" stroke="#00C9A7" stroke-width="1.2"/>
      <circle cx="20" cy="24" r="8" fill="#00C9A7"/>
      <circle cx="20" cy="24" r="4" fill="#0B0F14"/>
      <text x="36" y="21" fill="#FFFFFF" font-size="12" font-weight="700">Meshtastic UI (MUI Touch)</text>
      <text x="36" y="36" fill="#7EE787" font-size="10">firmware-t-deck-tft-2.8.1.8e6a88d.bin</text>
    </g>
  </g>

  <!-- Card 3: Action & Status -->
  <g transform="translate(20, 484)" filter="url(#shadow)">
    <!-- Big CTA Button -->
    <rect x="0" y="0" width="340" height="52" rx="14" fill="url(#accentGrad)"/>
    <text x="170" y="32" fill="#0B1411" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">⚡ FLASH FIRMWARE (921,600 BAUD)</text>
    
    <!-- Options sub-bar -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="164" height="42" rx="10" fill="#151C24" stroke="#222C38" stroke-width="1"/>
      <text x="82" y="25" fill="#8B949E" font-size="11" font-weight="600" text-anchor="middle">Erase Flash: <tspan fill="#F85149">NO</tspan></text>
      <rect x="176" y="0" width="164" height="42" rx="10" fill="#151C24" stroke="#222C38" stroke-width="1"/>
      <text x="258" y="25" fill="#8B949E" font-size="11" font-weight="600" text-anchor="middle">Backup Config: <tspan fill="#3FB950">YES</tspan></text>
    </g>
  </g>

  <!-- Features Badge Strip -->
  <g transform="translate(20, 604)">
    <rect x="0" y="0" width="340" height="72" rx="12" fill="#11161D" stroke="#1D242C" stroke-width="1"/>
    <circle cx="28" cy="24" r="10" fill="#1F6FEB" opacity="0.2"/>
    <text x="28" y="28" fill="#58A6FF" font-size="10" font-weight="700" text-anchor="middle">100%</text>
    <text x="46" y="27" fill="#E6EDF3" font-size="11" font-weight="600">Offline Field Flasher</text>
    <text x="46" y="42" fill="#7D8590" font-size="9.5">Pure Kotlin esptool SLIP ROM • No PC needed</text>

    <circle cx="28" cy="54" r="4" fill="#3FB950"/>
    <text x="46" y="58" fill="#7EE787" font-size="9.5" font-weight="600">CRC32 Block Verification • Auto DTR/RTS Reset</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 696)">
    <rect x="0" y="0" width="380" height="84" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <!-- Tab 1 Active -->
    <circle cx="68" cy="28" r="16" fill="#00C9A7" opacity="0.15"/>
    <path d="M68 20 L62 32 L68 30 L74 36 L70 24 Z" fill="#00E5BD"/>
    <text x="68" y="52" fill="#00E5BD" font-size="10" font-weight="700" text-anchor="middle">Flasher</text>
    <!-- Tab 2 -->
    <rect x="156" y="20" width="16" height="12" rx="2" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="164" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Terminal</text>
    <!-- Tab 3 -->
    <path d="M256 20 h16 v12 h-16 z M260 20 v-2 a4 4 0 0 1 8 0 v2" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="264" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Vault</text>
    <!-- Tab 4 -->
    <circle cx="330" cy="26" r="7" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="330" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Test Bench</text>
  </g>
</svg>
