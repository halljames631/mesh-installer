<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780" style="background: #0B0F14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F3D" />
      <stop offset="100%" stop-color="#1B172E" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" />
      <stop offset="100%" stop-color="#BC8CFF" />
    </linearGradient>
  </defs>

  <!-- Device Frame Outline -->
  <rect x="2" y="2" width="376" height="776" rx="36" fill="#0B0F14" stroke="#222C38" stroke-width="2.5"/>

  <!-- Status Bar -->
  <text x="28" y="28" fill="#8E9AA8" font-size="11" font-weight="600">09:44</text>
  <g transform="translate(315, 18)" fill="#8E9AA8">
    <path d="M0 8 h4 v-3 h-4 v3 M6 8 h4 v-5 h-4 v5 M12 8 h4 v-8 h-4 v8" fill="#8E9AA8"/>
    <rect x="20" y="2" width="18" height="9" rx="2" fill="none" stroke="#8E9AA8" stroke-width="1.2"/>
    <rect x="22" y="4" width="12" height="5" rx="1" fill="#BC8CFF"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="340" height="54" rx="14" fill="url(#headerGrad3)" stroke="#4C3268" stroke-width="1"/>
    <circle cx="28" cy="27" r="14" fill="#BC8CFF" opacity="0.2"/>
    <text x="28" y="32" fill="#BC8CFF" font-size="13" font-weight="800" text-anchor="middle">&gt;_</text>
    <text x="52" y="26" fill="#E6EDF3" font-size="16" font-weight="700">Serial Monitor</text>
    <text x="52" y="41" fill="#BC8CFF" font-size="10" font-weight="600">8N1 SERIAL • USB CDC STREAM</text>
    <rect x="256" y="16" width="68" height="22" rx="11" fill="#BC8CFF" opacity="0.2"/>
    <text x="290" y="31" fill="#BC8CFF" font-size="10" font-weight="700" text-anchor="middle">CONNECTED</text>
  </g>

  <!-- Control Strip -->
  <g transform="translate(20, 114)">
    <rect x="0" y="0" width="340" height="42" rx="10" fill="#151C24" stroke="#222C38" stroke-width="1"/>
    <!-- Baud Selector -->
    <rect x="8" y="7" width="94" height="28" rx="6" fill="#21262D"/>
    <text x="55" y="25" fill="#58A6FF" font-size="11" font-weight="700" text-anchor="middle">115200 Baud ▾</text>
    <!-- Toggle AutoScroll -->
    <rect x="110" y="7" width="80" height="28" rx="6" fill="#132320" stroke="#00C9A7" stroke-width="1"/>
    <text x="150" y="25" fill="#00E5BD" font-size="10" font-weight="700" text-anchor="middle">Auto-Scroll</text>
    <!-- Pause Button -->
    <rect x="198" y="7" width="62" height="28" rx="6" fill="#21262D"/>
    <text x="229" y="25" fill="#8B949E" font-size="10" font-weight="600" text-anchor="middle">Pause</text>
    <!-- Clear Button -->
    <rect x="268" y="7" width="64" height="28" rx="6" fill="#21262D"/>
    <text x="300" y="25" fill="#F85149" font-size="10" font-weight="600" text-anchor="middle">Clear</text>
  </g>

  <!-- Live Serial Log Box -->
  <g transform="translate(20, 166)">
    <rect x="0" y="0" width="340" height="456" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

    <!-- Terminal Content (Monospace) -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">
      <text x="14" y="28" fill="#7D8590">// Serial opened on /dev/bus/usb/001/002 @ 115200 8N1</text>
      
      <text x="14" y="52" fill="#58A6FF">[09:44:02.114]</text>
      <text x="100" y="52" fill="#3FB950">INFO</text>
      <text x="135" y="52" fill="#E6EDF3">Booting Meshtastic v2.8.1...</text>

      <text x="14" y="74" fill="#58A6FF">[09:44:02.320]</text>
      <text x="100" y="74" fill="#3FB950">INFO</text>
      <text x="135" y="74" fill="#E6EDF3">Chip: ESP32-S3 (16MB Quad-SPI)</text>

      <text x="14" y="96" fill="#58A6FF">[09:44:02.502]</text>
      <text x="100" y="96" fill="#3FB950">INFO</text>
      <text x="135" y="96" fill="#E6EDF3">SX1262 LoRa Radio initialized</text>

      <text x="14" y="118" fill="#58A6FF">[09:44:02.680]</text>
      <text x="100" y="118" fill="#00E5BD">RADIO</text>
      <text x="135" y="118" fill="#7EE787">Freq: 915.000 MHz, BW: 250kHz</text>

      <text x="14" y="140" fill="#58A6FF">[09:44:02.890]</text>
      <text x="100" y="140" fill="#3FB950">INFO</text>
      <text x="135" y="140" fill="#E6EDF3">Display: ST7789 TFT + GT911 touch</text>

      <text x="14" y="162" fill="#58A6FF">[09:44:03.110]</text>
      <text x="100" y="162" fill="#E3B341">GPS</text>
      <text x="135" y="162" fill="#D29922">Acquiring satellites (4 in view)</text>

      <text x="14" y="184" fill="#58A6FF">[09:44:03.450]</text>
      <text x="100" y="184" fill="#3FB950">INFO</text>
      <text x="135" y="184" fill="#E6EDF3">Keyboard: LilyGO T-Deck keypad OK</text>

      <!-- Sent command -->
      <text x="14" y="214" fill="#BC8CFF">[09:44:08.012] &gt;&gt; TX: meshtastic --info</text>

      <text x="14" y="240" fill="#58A6FF">[09:44:08.204]</text>
      <text x="100" y="240" fill="#00E5BD">MESH</text>
      <text x="135" y="240" fill="#7EE787">Node: !2b4a1f8c "Field-Node-1"</text>

      <text x="14" y="262" fill="#58A6FF">[09:44:08.310]</text>
      <text x="100" y="262" fill="#00E5BD">MESH</text>
      <text x="135" y="262" fill="#7EE787">Battery: 4.14V (96%) • Charging</text>

      <text x="14" y="284" fill="#58A6FF">[09:44:08.412]</text>
      <text x="100" y="284" fill="#00E5BD">MESH</text>
      <text x="135" y="284" fill="#7EE787">Peers online: 7 mesh nodes active</text>

      <text x="14" y="306" fill="#58A6FF">[09:44:11.890]</text>
      <text x="100" y="306" fill="#3FB950">PKT</text>
      <text x="135" y="306" fill="#E6EDF3">Recv from !4f229a10: "Camp Base OK"</text>
      
      <text x="14" y="328" fill="#58A6FF">[09:44:11.950]</text>
      <text x="100" y="328" fill="#3FB950">SNR</text>
      <text x="135" y="328" fill="#E6EDF3">SNR: +8.75 dB, RSSI: -74 dBm</text>

      <text x="14" y="358" fill="#7D8590">// Listening on serial interface...</text>
      <line x1="14" y1="370" x2="326" y2="370" stroke="#21262D" stroke-width="1"/>
      <text x="14" y="394" fill="#BC8CFF">[09:44:15.002] &gt;&gt; Ready for serial input</text>
    </g>
  </g>

  <!-- Input Field & Send Button -->
  <g transform="translate(20, 632)">
    <rect x="0" y="0" width="260" height="44" rx="10" fill="#151C24" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="27" fill="#7D8590" font-size="11">Enter command (e.g. reboot, --info)...</text>
    <rect x="270" y="0" width="70" height="44" rx="10" fill="url(#purpleGrad)"/>
    <text x="305" y="27" fill="#0B0F14" font-size="12" font-weight="700" text-anchor="middle">SEND</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 696)">
    <rect x="0" y="0" width="380" height="84" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <path d="M68 20 L62 32 L68 30 L74 36 L70 24 Z" fill="#7D8590"/>
    <text x="68" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Flasher</text>

    <!-- Tab 2 Active -->
    <circle cx="164" cy="28" r="16" fill="#BC8CFF" opacity="0.15"/>
    <rect x="156" y="20" width="16" height="12" rx="2" fill="none" stroke="#BC8CFF" stroke-width="1.8"/>
    <text x="164" y="52" fill="#BC8CFF" font-size="10" font-weight="700" text-anchor="middle">Terminal</text>

    <path d="M256 20 h16 v12 h-16 z M260 20 v-2 a4 4 0 0 1 8 0 v2" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="264" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Vault</text>
    <circle cx="330" cy="26" r="7" fill="none" stroke="#7D8590" stroke-width="1.5"/>
    <text x="330" y="52" fill="#7D8590" font-size="10" font-weight="500" text-anchor="middle">Test Bench</text>
  </g>
</svg>
